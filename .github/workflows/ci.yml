name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELF3D_CMAKE_VERSION: "4.3.4"
  ELF3D_CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  quality:
    name: Quality contracts
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        run: |
          python -m venv out/ci-tools
          .\out\ci-tools\Scripts\python.exe -m pip install `
            --disable-pip-version-check --no-deps `
            "cmake==$env:ELF3D_CMAKE_VERSION" `
            "clang-format==$env:ELF3D_CLANG_FORMAT_VERSION"
          (Resolve-Path .\out\ci-tools\Scripts).Path |
            Add-Content -Path $env:GITHUB_PATH
      - name: Verify CMake version
        run: .\cmake\check-cmake-version.ps1
      - name: Check C++ formatting
        run: |
          .\cmake\check-format.ps1 `
            -ClangFormatExecutable .\out\ci-tools\Scripts\clang-format.exe
      - name: Validate preset contracts
        run: .\cmake\check-preset-contracts.ps1

  windows-debug:
    name: Windows full Debug
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CMake
        run: |
          python -m venv out/ci-cmake
          .\out\ci-cmake\Scripts\python.exe -m pip install `
            --disable-pip-version-check --no-deps `
            "cmake==$env:ELF3D_CMAKE_VERSION"
          (Resolve-Path .\out\ci-cmake\Scripts).Path |
            Add-Content -Path $env:GITHUB_PATH
      - name: Verify CMake version
        run: .\cmake\check-cmake-version.ps1
      - name: Configure
        run: cmake --preset windows-debug
      - name: Build
        run: cmake --build --preset windows-debug --parallel 4
      - name: Test
        run: ctest --preset windows-debug --output-on-failure

  windows-model-debug:
    name: Windows model-only Debug
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CMake
        run: |
          python -m venv out/ci-cmake
          .\out\ci-cmake\Scripts\python.exe -m pip install `
            --disable-pip-version-check --no-deps `
            "cmake==$env:ELF3D_CMAKE_VERSION"
          (Resolve-Path .\out\ci-cmake\Scripts).Path |
            Add-Content -Path $env:GITHUB_PATH
      - name: Verify CMake version
        run: .\cmake\check-cmake-version.ps1
      - name: Configure
        run: cmake --preset windows-model-debug
      - name: Build
        run: cmake --build --preset windows-model-debug --parallel 4
      - name: Test
        run: ctest --preset windows-model-debug --output-on-failure

  windows-release:
    name: Windows ${{ matrix.profile }} Release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            preset: windows-release
          - profile: model-only
            preset: windows-model-release
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CMake
        run: |
          python -m venv out/ci-cmake
          .\out\ci-cmake\Scripts\python.exe -m pip install `
            --disable-pip-version-check --no-deps `
            "cmake==$env:ELF3D_CMAKE_VERSION"
          (Resolve-Path .\out\ci-cmake\Scripts).Path |
            Add-Content -Path $env:GITHUB_PATH
      - name: Verify CMake version
        run: .\cmake\check-cmake-version.ps1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
