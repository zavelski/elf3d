name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install formatter
        run: |
          python -m venv out/ci-tools
          .\out\ci-tools\Scripts\python.exe -m pip install --disable-pip-version-check --no-deps clang-format==23.1.0
      - name: Check native build contracts
        run: .\tools\check-build.ps1 -CheckFixtures
      - name: Check formatting
        run: .\tools\check-format.ps1 -ClangFormatExecutable .\out\ci-tools\Scripts\clang-format.exe
      - name: Check internal architecture and policies
        run: |
          if (Test-Path .internal/architecture/module-graph.json) {
            ./tools/module-graph/check-module-graph.ps1 -CheckFixtures
            ./tools/green-profile/check-green-profile.ps1 -CheckFixtures
            ./tools/policy-derivation/check-policy-access.ps1 -CheckFixtures
          }
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [Model, Full]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
        if: matrix.configuration == 'Debug' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - name: Build and test
        if: matrix.configuration == 'Debug' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          $source = $PWD.Path
          if (Test-Path .internal/publication/public-files.txt) {
            $source = Join-Path $PWD 'out/public/ci-source'
            ./.agents/skills/elf3d-github-release/scripts/export-public-source.ps1 -RepositoryRoot $PWD -SourceRef HEAD -Destination $source
          }
          "ELF3D_CI_SOURCE=$source" >> $env:GITHUB_ENV
          & "$source/tools/test.ps1" -RepositoryRoot $source -Profile ${{ matrix.profile }} -Configuration ${{ matrix.configuration }} -Build -Headers
      - name: Check external consumers
        if: matrix.configuration == 'Debug' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: '& "$env:ELF3D_CI_SOURCE/tools/check-examples.ps1" -RepositoryRoot $env:ELF3D_CI_SOURCE -Profile ${{ matrix.profile }} -Configuration ${{ matrix.configuration }}'
